                            <div style="display: grid; grid-template-columns: 24px 1fr 100px; gap: 6px; align-items: center;">

                            <div style="display: grid; grid-template-columns: 24px 1fr 100px; gap: 6px; align-items: center;">

                                <input type="text" id="pname_2" value="Computer 2" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #94a3b8;">

    <script>
        function updatePlayerConfigRows() {
            const count = parseInt(document.getElementById('numPlayersSelect').value, 10);
            const container = document.getElementById('playersConfigRows');
            const colors = ['#e11d48', '#2563eb', '#16a34a', '#d97706'];
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const isFirst = (i === 0);
                const row = document.createElement('div');
                row.style.display = 'grid';
                row.style.gridTemplateColumns = '24px 1fr 100px';
                row.style.gap = '6px';
                row.style.alignItems = 'center';
                row.innerHTML = `
                    <div style="width: 20px; height: 20px; border-radius: 50%; background: ${colors[i]};"></div>
                    <input type="text" id="pname_${i}" value="${isFirst ? 'You (P1)' : 'Computer ' + i}" style="padding: 4px 8px; border-radius: 4px; border: 1px solid #94a3b8;">
                    <select id="ptype_${i}" style="padding: 4px; border-radius: 4px;">
                        <option value="human" ${isFirst ? 'selected' : ''}>👤 Human</option>
                        <option value="bot" ${!isFirst ? 'selected' : ''}>🤖 Bot</option>
                    </select>
                `;
                container.appendChild(row);
            }
        }
    </script>

    <script>
        (function () {
            var nascosto = false;
            var observer = new MutationObserver(function () {
                if (nascosto) return;
                var divs = document.querySelectorAll('body > div');
                for (var i = 0; i < divs.length; i++) {
                    if (divs[i].shadowRoot && !divs[i].className && (divs[i].getAttribute('style') || '').length > 5000) {
                        divs[i].style.setProperty('display', 'none', 'important');
                        nascosto = true;
                        observer.disconnect();
                        return;
                    }
                }
            });
            observer.observe(document.body, { childList: true });
        })();
    </script>
