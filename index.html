	<script>
	(function() {
		var nascosto = false;
		var observer = new MutationObserver(function() {
			if (nascosto) return;
			var divs = document.querySelectorAll('body > div');
			for (var i = 0; i < divs.length; i++) {
				if (divs[i].shadowRoot && !divs[i].className && (divs[i].getAttribute('style')||'').length > 5000) {
					divs[i].style.setProperty('display', 'none', 'important');
					nascosto = true;
					observer.disconnect();
					return;
				}
			}
		});
		observer.observe(document.body, { childList: true });
	})();
	</script>

<script src="jquery-2.1.1.js"></script>
<script>
	var adjustscreen = function () {
		zm = 1, wh = $(window).height(), ww = $(window).width();
		zm = wh / 750;
		zm = Math.min(zm, ww / 1024)
		$("body").css({ transform: "scale(" + zm + ")" });
		$("#campogioco").css({ "position": "absolute", "left": (ww / zm - 1024) / 2 })
	};
	adjustscreen();

	$(window).resize(function () {
		adjustscreen();
	});

	// I18N LOGIC
	function setLanguage(lang) {
		localStorage.setItem('userLanguage', lang);
		showLang(lang);
	}

	function showLang(lang) {
		document.documentElement.lang = lang;
		
		// Update flags UI
		$('.pulsante-flag').removeClass('active');
		$('#btn-' + lang).addClass('active');

		// Update Spider link
		if (lang === 'en') {
			$('#link-spider').attr('href', 'spider-en.html');
			$('#meta-description').attr('content', 'Play free online card games like Scala 40, Machiavelli, Burraco, and Spider Solitaire. Also featuring an advanced, fully customizable metronome.');
		} else {
			$('#link-spider').attr('href', 'spider.html');
			$('#meta-description').attr('content', 'Gioca gratis online a Scala 40, Machiavelli, Burraco e Spider. Include anche un metronomo avanzato e personalizzabile.');
		}

		// Show/hide language specific elements
		if (lang === 'en') {
			$('.lang-it').hide();
			$('.lang-en').show();
		} else {
			$('.lang-en').hide();
			$('.lang-it').show();
		}
	}

	window.onload = function() {
		// Priority: 1. URL param ?lang= 2. localStorage 3. Default (it)
		var urlParams = new URLSearchParams(window.location.search);
		var lang = urlParams.get('lang');
		
		if (!lang) {
			lang = localStorage.getItem('userLanguage');
		}
		
		if (!lang || (lang !== 'it' && lang !== 'en')) {
			lang = 'it';
		}
		
		showLang(lang);
	};
</script>
