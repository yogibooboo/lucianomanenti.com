	<script>
		var adjustscreen = function () {
			zm = 1, wh = $(window).height(), ww = $(window).width();
			zm = wh / 750;
			zm = Math.min(zm, ww / 1024)
			$("body").css({ transform: "scale(" + zm + ")" });
			$("#campogioco").css({ "position": "absolute", "left": (ww / zm - 1024) / 2 })
		};
		adjustscreen();

		$(window).resize(function () {
			adjustscreen();
		});

		(function () {
			var nascosto = false;
			var observer = new MutationObserver(function () {
				if (nascosto) return;
				var divs = document.querySelectorAll('body > div');
				for (var i = 0; i < divs.length; i++) {
					if (divs[i].shadowRoot && !divs[i].className && (divs[i].getAttribute('style') || '').length > 5000) {
						divs[i].style.setProperty('display', 'none', 'important');
						nascosto = true;
						observer.disconnect();
						return;
					}
				}
			});
			observer.observe(document.body, { childList: true });
		})();
	</script>
