<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Banner</title>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9335537153013492"
        crossorigin="anonymous"></script>

    <script>
        window.gameConfig = {
            gaPrefix: 'RUM_',
            adsenseActive: true,
            hideLegalFooter: true,
            adsenseSlots: {
                '300x600': '5266697442',
                '160x600': '1167670336',
                '300x250': '8471445288',
                '160x250': '8663016975'
            }
        };
        window.currentLang = 'it';
    </script>
    <script>
        window._blockAutoInterstitial = true;
    </script>
    <script src="game-layout.js"></script>
    <script>
        ENABLE_INTERSTITIAL = true;
    </script>

    <link rel="stylesheet" href="rummy.css?v=2.9">

    <style>
        #pannello-test {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 1000;
        }
        .btn-group { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .btn-test { padding: 10px 16px; font-size: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; line-height: 1.4; }
        .btn-interstitial-new  { background: #1a6a8a; color: #fff; }
        .btn-interstitial-old  { background: #2a5a8a; color: #fff; }
        .btn-finish-new        { background: #8a5a1a; color: #fff; }
        .btn-finish-old        { background: #6a3a1a; color: #fff; }
        .btn-util              { background: #333; color: #aaa; font-size: 11px; padding: 7px 12px; }
        .label-group           { color: #e8d870; font-size: 11px; font-weight: bold; letter-spacing: 1px; }
        #info-stato            { font-size: 10px; color: #666; text-align: center; }

        /* Form finale simulato */
        #form-test {
            display: none;
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; height: 460px;
            background: #2d5a3d; border-radius: 12px;
            z-index: 100000; box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            flex-direction: column; align-items: center; justify-content: flex-end;
            padding: 20px; gap: 12px;
        }
        #form-test.visible { display: flex; }
        #form-test h3 { color: #e8d870; font-size: 20px; }
        #form-test button { background: #2d7a4a; color: #fff; padding: 10px 28px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; }
        #finish-banner-area { position: absolute; top: 0; left: 0; width: 100%; height: 320px; overflow: hidden; border-radius: 12px 12px 0 0; }
    </style>
</head>
<body>
    <div class="main-container">
        <div id="sidebar-left" class="sidebar"></div>
        <div id="sidebar-right" class="sidebar"></div>

        <div id="campogioco">
            <div id="schermo"></div>

            <div id="pannello-test">
                <div class="label-group">INTERSTITIAL</div>
                <div class="btn-group">
                    <button class="btn-test btn-interstitial-new" onclick="testInterstitial('7155310138')">Slot NUOVO<br><small>7155310138</small></button>
                    <button class="btn-test btn-interstitial-old" onclick="testInterstitial('6538837230')">Slot FINISH<br><small>6538837230</small></button>
                </div>

                <div class="label-group" style="margin-top:8px">FORM FINALE</div>
                <div class="btn-group">
                    <button class="btn-test btn-finish-new" onclick="testFinish('7155310138')">Slot NUOVO<br><small>7155310138</small></button>
                    <button class="btn-test btn-finish-old" onclick="testFinish('6538837230')">Slot FINISH<br><small>6538837230</small></button>
                </div>

                <div class="btn-group" style="margin-top:8px">
                    <button class="btn-test btn-util" onclick="resetTiming()">Reset timing</button>
                    <button class="btn-test btn-util" onclick="location.reload()">Reload</button>
                </div>

                <div id="info-stato"></div>
            </div>
        </div>
    </div>

    <!-- Form finale simulato -->
    <div id="form-test">
        <div id="finish-banner-area"></div>
        <h3>HAI VINTO!</h3>
        <button onclick="chiudiForm()">NUOVA PARTITA</button>
    </div>

    <script src="site.js?v=1.1"></script>

    <script>
        function fmtMin(ms) { return (ms / 60000).toFixed(1) + ' min'; }
        function row(label, value, ok) {
            var col = ok === true ? '#6f6' : ok === false ? '#f66' : '#ccc';
            return '<tr><td style="padding:3px 16px 3px 0;color:#999;white-space:nowrap">' + label + '</td>' +
                   '<td style="color:' + col + ';font-weight:bold">' + value + '</td></tr>';
        }

        function aggiornaInfo() {
            var last = localStorage.getItem('_interstitial_last_shown');
            var session = localStorage.getItem('_interstitial_session_start');
            var pending = localStorage.getItem('_interstitial_pending');
            var now = Date.now();
            var sessionElapsed = session ? now - parseInt(session) : null;
            var lastElapsed = last ? now - parseInt(last) : null;
            var sessionOk = sessionElapsed !== null && sessionElapsed >= INTERSTITIAL_MIN_SESSION_MINUTES * 60000;
            var cooldownOk = lastElapsed === null || lastElapsed >= INTERSTITIAL_COOLDOWN_MINUTES * 60000;
            var pronto = ENABLE_INTERSTITIAL && sessionOk && cooldownOk;

            var html = '<table style="border-collapse:collapse;font-size:12px;text-align:left;background:rgba(0,0,0,0.5);padding:10px;border-radius:8px">';
            html += row('devMode', devMode, devMode ? null : null);
            html += row('ENABLE_INTERSTITIAL', ENABLE_INTERSTITIAL, ENABLE_INTERSTITIAL);
            html += row('pending', pending || 'no', null);
            html += '<tr><td colspan="2" style="padding:4px 0 2px;color:#555;font-size:10px">── SESSIONE ──</td></tr>';
            html += row('inizio sessione', session ? new Date(parseInt(session)).toLocaleTimeString() : 'nessuna', session ? true : false);
            html += row('durata sessione', sessionElapsed !== null ? fmtMin(sessionElapsed) : '—', sessionOk);
            html += row('minimo richiesto', INTERSTITIAL_MIN_SESSION_MINUTES + ' min', null);
            html += '<tr><td colspan="2" style="padding:4px 0 2px;color:#555;font-size:10px">── COOLDOWN ──</td></tr>';
            html += row('ultima visualizzazione', last ? new Date(parseInt(last)).toLocaleTimeString() : 'mai', last ? true : true);
            html += row('tempo trascorso', lastElapsed !== null ? fmtMin(lastElapsed) : '—', cooldownOk);
            html += row('cooldown richiesto', INTERSTITIAL_COOLDOWN_MINUTES + ' min', null);
            html += '<tr><td colspan="2" style="padding:6px 0 2px"></td></tr>';
            html += row('▶ PRONTO?', pronto ? 'SÌ' : 'NO', pronto);
            html += '</table>';
            document.getElementById('info-stato').innerHTML = html;
        }

        function testInterstitial(slot) {
            localStorage.setItem('_interstitial_last_shown', Date.now());
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:999999;';

            var adArea = document.createElement('div');
            adArea.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:50px;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;';

            if (devMode) {
                var ph = document.createElement('div');
                ph.style.cssText = 'width:100%;height:100%;border:2px dashed #ffcc00;box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:#ffcc00;font-family:monospace;font-size:16px;text-align:center;';
                ph.textContent = '[DEV] Interstitial — slot ' + slot;
                adArea.appendChild(ph);
            }

            var footer = document.createElement('div');
            footer.style.cssText = 'position:absolute;bottom:0;left:0;right:0;height:50px;background:#111;padding:0 16px;display:flex;align-items:center;justify-content:space-between;';
            footer.innerHTML = '<span style="color:#888;font-size:12px;">Slot: ' + slot + (devMode ? ' [DEV]' : '') + '</span>';
            var btnClose = document.createElement('button');
            btnClose.textContent = '✕ Chiudi';
            btnClose.style.cssText = 'background:#333;color:#fff;border:none;border-radius:6px;padding:8px 18px;cursor:pointer;font-size:14px;';
            btnClose.onclick = function() { document.body.removeChild(overlay); aggiornaInfo(); };
            footer.appendChild(btnClose);

            overlay.appendChild(adArea);
            overlay.appendChild(footer);
            document.body.appendChild(overlay); // prima nel DOM

            if (!devMode) {
                var ins = document.createElement('ins');
                ins.className = 'adsbygoogle';
                ins.style.cssText = 'display:block;width:' + adArea.offsetWidth + 'px;height:' + adArea.offsetHeight + 'px;';
                ins.setAttribute('data-ad-client', 'ca-pub-9335537153013492');
                ins.setAttribute('data-ad-slot', slot);
                ins.setAttribute('data-ad-format', 'auto');
                ins.setAttribute('data-full-width-responsive', 'true');
                ins.setAttribute('onmouseenter', 'window._isMouseOverAdSense = true;');
                ins.setAttribute('onmouseleave', 'window._isMouseOverAdSense = false;');
                adArea.appendChild(ins); // poi l'ins
                (window.adsbygoogle = window.adsbygoogle || []).push({}); // poi push
            }
            aggiornaInfo();
        }

        function testFinish(slot) {
            var area = document.getElementById('finish-banner-area');
            area.innerHTML = '';

            if (devMode) {
                var ph = document.createElement('div');
                ph.style.cssText = 'width:100%;height:100%;border:2px dashed #ffee00;box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:#ffee00;font-family:monospace;font-size:14px;text-align:center;';
                ph.textContent = '[DEV] Finish banner — slot ' + slot;
                area.appendChild(ph);
            } else {
                var ins = document.createElement('ins');
                ins.className = 'adsbygoogle';
                ins.style.cssText = 'display:block;width:500px;height:320px;';
                ins.setAttribute('data-ad-client', 'ca-pub-9335537153013492');
                ins.setAttribute('data-ad-slot', slot);
                ins.setAttribute('onmouseenter', 'window._isMouseOverAdSense = true;');
                ins.setAttribute('onmouseleave', 'window._isMouseOverAdSense = false;');
                area.appendChild(ins);
                (window.adsbygoogle = window.adsbygoogle || []).push({});
            }

            document.getElementById('form-test').classList.add('visible');
            aggiornaInfo();
        }

        function chiudiForm() {
            document.getElementById('form-test').classList.remove('visible');
            document.getElementById('finish-banner-area').innerHTML = '';
        }

        function resetTiming() {
            localStorage.removeItem('_interstitial_last_shown');
            localStorage.removeItem('_interstitial_session_start');
            localStorage.removeItem('_interstitial_last_activity');
            localStorage.removeItem('_interstitial_pending');
            aggiornaInfo();
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Inizializza la sessione come farebbe showInterstitialIfDue
            var SESSION_RESET_MINUTES = 60;
            var now = Date.now();
            var sessionStart = parseInt(localStorage.getItem('_interstitial_session_start') || '0', 10);
            var lastActivity = parseInt(localStorage.getItem('_interstitial_last_activity') || '0', 10);
            if (!sessionStart || (lastActivity > 0 && (now - lastActivity) > SESSION_RESET_MINUTES * 60000)) {
                sessionStart = now;
                localStorage.setItem('_interstitial_session_start', sessionStart);
            }
            localStorage.setItem('_interstitial_last_activity', now);

            aggiornaInfo();
            setInterval(aggiornaInfo, 10000); // aggiorna ogni 10 secondi

            if (typeof window.waitForInterstitial === 'function') {
                window.waitForInterstitial(function() { aggiornaInfo(); });
            }
        });
    </script>
</body>
</html>
