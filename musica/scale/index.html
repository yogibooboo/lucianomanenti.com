<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">

    <!-- Funzioni comuni del sito: GA, icone, audio, navigazione, riquadro di consenso -->
    <script src="../../site.js"></script>

    <title>Scale Musicali - Ear Training - lucianomanenti.com</title>
    <link rel="canonical" href="https://www.lucianomanenti.com/musica/scale/">
    <link rel="alternate" hreflang="it" href="https://www.lucianomanenti.com/musica/scale/">
    <link rel="alternate" hreflang="en" href="https://www.lucianomanenti.com/musica/scale/index-en.html">
    <link rel="alternate" hreflang="x-default" href="https://www.lucianomanenti.com/musica/scale/">
    <link rel="manifest" href="/favicon/site.webmanifest">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Description" content="Allena l'orecchio musicale riconoscendo le scale: maggiore, minore, modi e molto altro. Gratis online.">

    <link rel="stylesheet" href="../musica.css?v=1.2">
    <link rel="stylesheet" href="scale.css?v=1.5">

    <script>
        // spazi: false = niente promozioni ai lati: le pagine di musica restano pulite
        window.gameConfig = { gaPrefix: 'MUSSCL_', spazi: false };
    </script>
</head>
<body>

<div class="main-container">
    <div id="campogioco">

        <div class="lang-switch-game">
            <a href="index.html" class="active">IT</a>
            <a href="index-en.html">EN</a>
        </div>

        <!-- Top bar -->
        <div id="topbar">
            <div class="altri-musicali">
                <a href="../intervalli/">&#127925; Intervalli</a>
                <a href="../accordi/">&#127928; Accordi</a>
                <a href="../metronomo/">&#9201; Metronomo</a>
            </div>
            <span class="title">&#9834; Scale</span>
            <div id="score-area">
                <span id="score">0 / 0</span>
                <button id="btn-reset">Azzera</button>
            </div>
        </div>

        <!-- Direction selector -->
        <div id="dir-selector">
            <button class="btn-dir active" data-dir="up">&#8679; Ascendente</button>
            <button class="btn-dir" data-dir="down">&#8681; Discendente</button>
            <button class="btn-dir" data-dir="both">&#8645; Entrambe</button>
        </div>

        <!-- Difficulty selector -->
        <div id="diff-selector">
            <button class="btn-diff active" data-diff="1">1 &mdash; Base</button>
            <button class="btn-diff" data-diff="2">2 &mdash; Facile</button>
            <button class="btn-diff" data-diff="3">3 &mdash; Medio</button>
            <button class="btn-diff" data-diff="4">4 &mdash; Esperto</button>
            <button class="btn-diff" data-diff="5">5 &mdash; Avanzate</button>
        </div>

        <!-- Note selector -->
        <div id="note-selector">
            <span class="nota-label">Nota di base:</span>
            <button id="btn-root-random">&#x21BA; Casuale</button>
            <button id="btn-root-prev" class="btn-root-nav">&#9664;</button>
            <span id="root-note-display">C4</span>
            <button id="btn-root-next" class="btn-root-nav">&#9654;</button>
        </div>

        <!-- Volume slider -->
        <div id="volume-container">
            <div id="volume-slider-wrap">
                <input type="range" id="volume-control" min="-20" max="20" step="1" value="0">
            </div>
            <div class="volume-label">Volume</div>
        </div>

        <!-- Play area -->
        <div id="play-area">
            <div id="staff-bg"></div>
            <div id="play-col">
                <button id="btn-play" disabled title="Caricamento campioni...">&#9654;</button>
                <div id="feedback"></div>
            </div>
            <svg id="staff-svg" xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 220 130" preserveAspectRatio="xMidYMid meet"></svg>
        </div>

        <!-- Piano keyboard -->
        <div id="piano-keyboard"></div>

        <!-- Label -->
        <div id="label-scegli">Scegli la scala</div>

        <!-- Scale grid -->
        <div id="grid-scale">
            <button class="btn-scale" data-id="maj"     disabled>Maggiore</button>
            <button class="btn-scale" data-id="min"     disabled>Minore Nat.</button>
            <button class="btn-scale" data-id="minarm"  disabled>Minore Arm.</button>
            <button class="btn-scale" data-id="minmel"  disabled>Minore Mel.</button>
            <button class="btn-scale" data-id="dor"     disabled>Dorico</button>
            <button class="btn-scale" data-id="fri"     disabled>Frigio</button>
            <button class="btn-scale" data-id="lid"     disabled>Lidio</button>
            <button class="btn-scale" data-id="mis"     disabled>Misolidio</button>
            <button class="btn-scale" data-id="eol"     disabled>Eolio</button>
            <button class="btn-scale" data-id="loc"     disabled>Locrio</button>
            <button class="btn-scale" data-id="pent"    disabled>Pentatonica</button>
            <button class="btn-scale" data-id="blues"   disabled>Blues</button>
            <button class="btn-scale" data-id="dim"     disabled>Diminuita</button>
            <button class="btn-scale" data-id="aug"     disabled>Aumentata</button>
            <button class="btn-scale" data-id="alts"    disabled>Alterata</button>
        </div>

        <!-- Bottom nav -->
        <div id="bottom-nav">
            <div class="btn-nav-group">
                <a href="regole-scale.html" target="_blank" class="btn-nav btn-nav-help">Istruzioni</a>
                <a href="../index.html" class="btn-nav btn-nav-music">&#9834; Musica</a>
                <a href="../../index.html" class="btn-nav btn-nav-home">TUTTI I GIOCHI</a>
                <a href="../../aboutme.html" target="_blank" class="btn-nav btn-nav-contact">Scrivetemi</a>
            </div>
            <div class="nav-links-small">
                <a href="../../privacy.html" target="_blank">Privacy</a>
                <a href="javascript:googlefc.callbackQueue.push(googlefc.showRevocationMessage)">Gestisci Cookie</a>
            </div>
        </div>

    </div><!-- campogioco -->
</div>

<script src="../lib/tone.js"></script>
<script src="scale.js?v=1.4"></script>
</body>
</html>
