            hideLegalFooter: true,

<body>

<div class="main-container">
    <div id="sidebar-left" class="sidebar"></div>
    <div id="sidebar-right" class="sidebar"></div>

    <div id="campogioco">

        <div class="lang-switch-game">
            <a href="index.html">IT</a>
            <a href="index-en.html" class="active">EN</a>
        </div>

        <!-- Top bar -->
        <div id="topbar">
            <a href="../index-en.html" class="back-link">&#8592; Music</a>
            <span class="title">&#9834; Scales</span>
            <div id="score-area">
                <span id="score">0 / 0</span>
                <button id="btn-reset">Reset</button>
            </div>
        </div>

        <!-- Direction selector -->
        <div id="dir-selector">
            <button class="btn-dir active" data-dir="up">&#8679; Ascending</button>
            <button class="btn-dir" data-dir="down">&#8681; Descending</button>
            <button class="btn-dir" data-dir="both">&#8645; Both</button>
        </div>

        <!-- Difficulty selector -->
        <div id="diff-selector">
            <button class="btn-diff active" data-diff="1">1 &mdash; Basic</button>
            <button class="btn-diff" data-diff="2">2 &mdash; Easy</button>
            <button class="btn-diff" data-diff="3">3 &mdash; Medium</button>
            <button class="btn-diff" data-diff="4">4 &mdash; Expert</button>
            <button class="btn-diff" data-diff="5">5 &mdash; Advanced</button>
        </div>

        <!-- Note selector -->
        <div id="note-selector">
            <span class="nota-label">Root note:</span>
            <button id="btn-root-random">&#x21BA; Random</button>
            <button id="btn-root-prev" class="btn-root-nav">&#9664;</button>
            <span id="root-note-display">C4</span>
            <button id="btn-root-next" class="btn-root-nav">&#9654;</button>
        </div>

        <!-- Play area -->
        <div id="play-area">
            <div id="staff-bg"></div>
            <div id="play-col">
                <button id="btn-play" disabled title="Loading samples...">&#9654;</button>
                <div id="feedback"></div>
            </div>
            <svg id="staff-svg" xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 220 130" preserveAspectRatio="xMidYMid meet"></svg>
        </div>

        <!-- Piano keyboard -->
        <div id="piano-keyboard"></div>

        <!-- Label -->
        <div id="label-scegli">Choose the scale</div>

        <!-- Scale grid -->
        <div id="grid-scale">
            <button class="btn-scale" data-id="maj"     disabled>Major</button>
            <button class="btn-scale" data-id="min"     disabled>Natural Min.</button>
            <button class="btn-scale" data-id="minarm"  disabled>Harmonic Min.</button>
            <button class="btn-scale" data-id="minmel"  disabled>Melodic Min.</button>
            <button class="btn-scale" data-id="dor"     disabled>Dorian</button>
            <button class="btn-scale" data-id="fri"     disabled>Phrygian</button>
            <button class="btn-scale" data-id="lid"     disabled>Lydian</button>
            <button class="btn-scale" data-id="mis"     disabled>Mixolydian</button>
            <button class="btn-scale" data-id="eol"     disabled>Aeolian</button>
            <button class="btn-scale" data-id="loc"     disabled>Locrian</button>
            <button class="btn-scale" data-id="pent"    disabled>Pentatonic</button>
            <button class="btn-scale" data-id="blues"   disabled>Blues</button>
            <button class="btn-scale" data-id="dim"     disabled>Diminished</button>
            <button class="btn-scale" data-id="aug"     disabled>Augmented</button>
            <button class="btn-scale" data-id="alts"    disabled>Altered</button>
        </div>

        <!-- Bottom nav -->
        <div id="bottom-nav">
            <div class="btn-nav-group">
                <a href="guida-scale-en.html" target="_blank" class="btn-nav btn-nav-help">Instructions</a>

                <a href="javascript:googlefc.callbackQueue.push(googlefc.showRevocationMessage)">Manage Cookies</a>
            </div>
        </div>

    </div><!-- campogioco -->
</div>

<script src="../../site.js?v=1.1"></script>
<script src="../lib/tone.js"></script>
<script src="scale.js?v=1.3"></script>
<script>
    (function() {
        var nascosto = false;
        var observer = new MutationObserver(function() {
            if (nascosto) return;
            var divs = document.querySelectorAll('body > div');
            for (var i = 0; i < divs.length; i++) {
                if (divs[i].shadowRoot && !divs[i].className && (divs[i].getAttribute('style')||'').length > 5000) {
                    divs[i].style.setProperty('display', 'none', 'important');
                    nascosto = true;
                    observer.disconnect();
                    return;
                }
            }
        });
        observer.observe(document.body, { childList: true });
    })();
</script>
</body>
