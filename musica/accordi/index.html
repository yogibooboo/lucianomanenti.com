    <script>
        window.gameConfig = {
            gaPrefix: 'MUSACC_',
            hideLegalFooter: true,
            adsenseActive: true,
            adsenseSlots: {

<body>

<div class="main-container">
    <div id="sidebar-left" class="sidebar"></div>
    <div id="sidebar-right" class="sidebar"></div>

    <div id="campogioco">

        <div class="lang-switch-game">
            <a href="index.html" class="active">IT</a>
            <a href="index-en.html">EN</a>
        </div>

        <!-- Top bar -->
        <div id="topbar">
            <a href="../" class="back-link">&#8592; Musica</a>
            <span class="title">&#9834; Accordi</span>
            <div id="score-area">
                <span id="score">0 / 0</span>
                <button id="btn-reset">Azzera</button>
            </div>
        </div>

        <!-- Mode selector -->
        <div id="mode-selector">
            <button class="btn-mode active" data-mode="arpeggio-up">&#8679; Arpeggio</button>
            <button class="btn-mode" data-mode="arpeggio-down">&#8681; Arpeggio</button>
            <button class="btn-mode" data-mode="blocco">&#8645; Armonico</button>
        </div>

        <!-- Difficulty selector -->
        <div id="diff-selector">
            <button class="btn-diff active" data-diff="1">1 &mdash; Base</button>
            <button class="btn-diff" data-diff="2">2 &mdash; Facile</button>
            <button class="btn-diff" data-diff="3">3 &mdash; Medio</button>
            <button class="btn-diff" data-diff="4">4 &mdash; Esperto</button>
            <button class="btn-diff" data-diff="5">5 &mdash; Jazz</button>
        </div>

        <!-- Inversions selector -->
        <div id="inv-selector">
            <span class="inv-label">Inversioni:</span>
            <button id="btn-inversions">&#9837; Disattive</button>
            <span class="inv-sep">|</span>
            <span class="inv-label">Avanzamento:</span>
            <button id="btn-auto-advance">&#9646;&#9646; Manuale</button>
        </div>

        <!-- Note selector -->
        <div id="note-selector">
            <span class="nota-label">Nota di base:</span>
            <button id="btn-root-random">&#x21BA; Casuale</button>
            <button id="btn-root-prev" class="btn-root-nav">&#9664;</button>
            <span id="root-note-display">C4</span>
            <button id="btn-root-next" class="btn-root-nav">&#9654;</button>
        </div>

        <!-- Play area + Pentagramma -->
        <div id="play-area">
            <div id="staff-bg"></div>
            <div id="play-col">
                <button id="btn-play" disabled title="Caricamento campioni...">&#9654;</button>
                <div id="feedback"></div>
            </div>
            <svg id="staff-svg" xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 220 130" preserveAspectRatio="xMidYMid meet"></svg>
        </div>

        <!-- Tastiera piano -->
        <div id="piano-keyboard"></div>

        <!-- Label -->
        <div id="label-scegli">Scegli l&rsquo;accordo</div>

        <!-- Griglia accordi -->
        <div id="grid-accordi">
            <button class="btn-accord" data-id="min"     disabled>Minore</button>
            <button class="btn-accord" data-id="mag"     disabled>Maggiore</button>
            <button class="btn-accord" data-id="dom7"    disabled>Dom 7ª</button>
            <button class="btn-accord" data-id="maj7"    disabled>Maj 7ª</button>
            <button class="btn-accord" data-id="min7"    disabled>Min 7ª</button>
            <button class="btn-accord" data-id="aug"     disabled>Aumentato</button>
            <button class="btn-accord" data-id="dim7"    disabled>Diminuito 7ª</button>
            <button class="btn-accord" data-id="min6"    disabled>Min 6ª</button>
            <button class="btn-accord" data-id="maj6"    disabled>Mag 6ª</button>
            <button class="btn-accord" data-id="semidim" disabled>Semidiminuito</button>
            <button class="btn-accord" data-id="sus2"    disabled>Sus 2</button>
            <button class="btn-accord" data-id="sus4"    disabled>Sus 4</button>
            <button class="btn-accord" data-id="dom9"    disabled>Dom 9ª</button>
            <button class="btn-accord" data-id="min9"    disabled>Min 9ª</button>
            <button class="btn-accord" data-id="maj9"    disabled>Maj 9ª</button>
        </div>

        <!-- Bottom nav -->
        <div id="bottom-nav">
            <div class="btn-nav-group">
                <a href="../" class="btn-nav btn-nav-music">&#8592; Musica</a>
                <a href="guida-accordi.html" target="_blank" class="btn-nav btn-nav-help">Istruzioni</a>
                <a href="../../index.html" class="btn-nav btn-nav-home">Home Giochi</a>
                <a href="../../aboutme.html" target="_blank" class="btn-nav btn-nav-contact">Scrivetemi</a>
            </div>
            <div class="nav-links-small">
                <a href="../../privacy.html" target="_blank">Privacy</a>
                <a href="javascript:googlefc.callbackQueue.push(googlefc.showRevocationMessage)">Gestisci Cookie</a>
            </div>
        </div>

    </div><!-- campogioco -->
</div>

<script src="../../site.js?v=1.1"></script>
<script src="../lib/tone.js"></script>
<script src="accordi.js?v=1.0"></script>
<script>
    (function() {
        var nascosto = false;
        var observer = new MutationObserver(function() {
            if (nascosto) return;
            var divs = document.querySelectorAll('body > div');
            for (var i = 0; i < divs.length; i++) {
                if (divs[i].shadowRoot && !divs[i].className && (divs[i].getAttribute('style')||'').length > 5000) {
                    divs[i].style.setProperty('display', 'none', 'important');
                    nascosto = true;
                    observer.disconnect();
                    return;
                }
            }
        });
        observer.observe(document.body, { childList: true });
    })();
</script>
</body>
</html>
