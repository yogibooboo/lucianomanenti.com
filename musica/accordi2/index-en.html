            gaPrefix: 'MUSACC2_',
            hideLegalFooter: true,

<body>

<div class="main-container">
    <div id="sidebar-left" class="sidebar"></div>
    <div id="sidebar-right" class="sidebar"></div>

    <div id="campogioco">

        <div class="lang-switch-game">
            <a href="index.html">IT</a>
            <a href="index-en.html" class="active">EN</a>
        </div>

        <!-- Top bar -->
        <div id="topbar">
            <a href="../index-en.html" class="back-link">&#8592; Music</a>
            <span class="title">&#9834; Chords 2</span>
            <div id="score-area">
                <span id="streak" title="Current streak · best">&#128293; 0 &middot; 0</span>
                <span id="score">0 / 0</span>
                <button id="btn-reset">Reset</button>
                <button id="btn-stats" title="Per-chord statistics">&#128202;</button>
            </div>
        </div>

        <!-- Mode selector -->
        <div id="mode-selector">
            <button class="btn-mode active" data-mode="arpeggio-up">&#8679; Arpeggio</button>
            <button class="btn-mode" data-mode="arpeggio-down">&#8681; Arpeggio</button>
            <button class="btn-mode" data-mode="blocco">&#8645; Harmonic</button>
        </div>

        <!-- Difficulty selector -->
        <div id="diff-selector">
            <button class="btn-diff active" data-diff="1">1 &mdash; Basic</button>
            <button class="btn-diff" data-diff="2">2 &mdash; Easy</button>
            <button class="btn-diff" data-diff="3">3 &mdash; Medium</button>
            <button class="btn-diff" data-diff="4">4 &mdash; Expert</button>
            <button class="btn-diff" data-diff="5">5 &mdash; Jazz</button>
            <button class="btn-diff" data-diff="custom" title="Choose which chords to train">&#9733; Custom</button>
        </div>

        <!-- Inversions selector -->
        <div id="inv-selector">
            <span class="inv-label">Inversions:</span>
            <button id="btn-inversions">&#9837; Off</button>
            <span class="inv-sep">|</span>
            <span class="inv-label">Advance:</span>
            <button id="btn-auto-advance">&#9646;&#9646; Manual</button>
        </div>

        <!-- Note selector -->
        <div id="note-selector">
            <span class="nota-label">Root note:</span>
            <button id="btn-root-random">&#x21BA; Random</button>
            <button id="btn-root-prev" class="btn-root-nav">&#9664;</button>
            <span id="root-note-display">C4</span>
            <button id="btn-root-next" class="btn-root-nav">&#9654;</button>
        </div>

        <!-- Volume slider -->
        <div id="volume-container">
            <div id="volume-slider-wrap">
                <input type="range" id="volume-control" min="-20" max="20" step="1" value="0">
            </div>
            <div class="volume-label">Volume</div>
        </div>

        <!-- Play area + Staff -->
        <div id="play-area">
            <div id="staff-bg"></div>
            <div id="play-col">
                <button id="btn-play" disabled title="Loading samples... (Space = listen)">&#9654;</button>
                <div id="feedback"></div>
                <button id="btn-compare" class="hidden" title="Play the correct chord, then your choice (key C)">&#127922; Compare</button>
            </div>
            <svg id="staff-svg" xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 220 130" preserveAspectRatio="xMidYMid meet"></svg>
        </div>

        <!-- Piano keyboard -->
        <div id="piano-keyboard"></div>

        <!-- Label / result -->
        <div id="label-scegli">Choose the chord</div>

        <!-- Chord grid -->
        <div id="grid-accordi">
            <button class="btn-accord" data-id="min"     disabled>Minor</button>
            <button class="btn-accord" data-id="mag"     disabled>Major</button>
            <button class="btn-accord" data-id="dom7"    disabled>Dom 7th</button>
            <button class="btn-accord" data-id="maj7"    disabled>Maj 7th</button>
            <button class="btn-accord" data-id="min7"    disabled>Min 7th</button>
            <button class="btn-accord" data-id="aug"     disabled>Augmented</button>
            <button class="btn-accord" data-id="dim7"    disabled>Diminished 7th</button>
            <button class="btn-accord" data-id="min6"    disabled>Min 6th</button>
            <button class="btn-accord" data-id="maj6"    disabled>Maj 6th</button>
            <button class="btn-accord" data-id="semidim" disabled>Half-Diminished</button>
            <button class="btn-accord" data-id="sus2"    disabled>Sus 2</button>
            <button class="btn-accord" data-id="sus4"    disabled>Sus 4</button>
            <button class="btn-accord" data-id="dom9"    disabled>Dom 9th</button>
            <button class="btn-accord" data-id="min9"    disabled>Min 9th</button>
            <button class="btn-accord" data-id="maj9"    disabled>Maj 9th</button>
        </div>

        <!-- Statistics modal -->
        <div id="stats-modal" class="hidden">
            <div id="stats-box">
                <div id="stats-head">
                    <span class="stats-title">&#128202; Statistics</span>
                    <button id="btn-stats-close" title="Close (Esc)">&#x2715;</button>
                </div>
                <div id="stats-summary"></div>
                <div id="stats-table-wrap">
                    <table id="stats-table"></table>
                </div>
                <div id="stats-actions">
                    <button id="btn-stats-reset">Reset statistics</button>
                </div>
            </div>
        </div>

        <!-- Bottom nav -->
        <div id="bottom-nav">
            <div class="btn-nav-group">
                <a href="../index-en.html" class="btn-nav btn-nav-music">&#8592; Music</a>
                <a href="guida-accordi2-en.html" target="_blank" class="btn-nav btn-nav-help">Instructions</a>
                <a href="../../index-en.html" class="btn-nav btn-nav-home">Games</a>

            </div>
        </div>

    </div><!-- campogioco -->
</div>

<script src="../lib/tone.js"></script>
<script src="accordi2.js?v=1.0"></script>
<script>
    (function() {
        var nascosto = false;
        var observer = new MutationObserver(function() {
            if (nascosto) return;
            var divs = document.querySelectorAll('body > div');
            for (var i = 0; i < divs.length; i++) {
                if (divs[i].shadowRoot && !divs[i].className && (divs[i].getAttribute('style')||'').length > 5000) {
                    divs[i].style.setProperty('display', 'none', 'important');
                    nascosto = true;
                    observer.disconnect();
                    return;
                }
            }
        });
        observer.observe(document.body, { childList: true });
    })();
</script>
