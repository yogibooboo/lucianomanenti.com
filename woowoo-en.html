<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <!-- Site-wide functions: GA, icons, audio, navigation, consent box -->
    <script src="site.js"></script>

    <title>WooWoo Luciano — Switches, Trains and Stations</title>
    <link rel="canonical" href="https://www.lucianomanenti.com/woowoo-en.html">
    <link rel="alternate" hreflang="it" href="https://www.lucianomanenti.com/woowoo.html">
    <link rel="alternate" hreflang="en" href="https://www.lucianomanenti.com/woowoo-en.html">
    <link rel="alternate" hreflang="x-default" href="https://www.lucianomanenti.com/woowoo.html">
    <link rel="manifest" href="favicon/site.webmanifest">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Description"
        content="WooWoo Luciano: the real-time railway puzzle. Throw the switches, get every train to the right station and avoid crashes.">

    <link rel="stylesheet" href="woowoo.css?v=3.0" />

    <script>
        window.gameConfig = { gaPrefix: 'WOOWOO_' };
    </script>
</head>

<body>

    <div class="main-container">
        <div id="campogioco">
            <div id="schermo"></div>

            <!-- ================= HEADER ================= -->
            <div id="header-bar">
                <div class="header-left">
                    <div class="lang-switch-header">
                        <a href="woowoo.html">IT</a>
                        <a href="woowoo-en.html" class="active">EN</a>
                    </div>
                    <button id="w2-audio" class="bottone" style="height:26px;padding:0 10px;"
                        aria-label="Audio">&#128266;</button>
                    <div id="titolo-gioco">WooWoo Luciano &#128642;</div>
                </div>

                <div class="header-center">
                    <div class="quadrante ok"><span>DELIVERIES</span><b id="w2-consegne">0</b></div>
                    <div class="quadrante ko"><span>CRASHES</span><b id="w2-scontri">0</b></div>
                    <div class="quadrante tempo">
                        <span>TIME <i id="w2-turbo"></i></span>
                        <b id="w2-tempo">0</b>
                        <div class="barra-esterna"><div class="barra-piena" id="w2-barra"></div></div>
                    </div>
                </div>

                <div class="header-right">
                    <div class="targa-quadro">
                        <div class="tq-voce"><span>BOARD</span><b id="w2-livello">A &middot; 1/12</b></div>
                        <div class="tq-voce"><span>DIFFICULTY</span><b id="w2-grado">easy</b></div>
                    </div>
                </div>
            </div>

            <!-- ================= MAIN AREA ================= -->
            <div id="area-tabellone">
                <div id="canvas-wrapper">
                    <canvas id="w2-canvas" width="960" height="576"></canvas>
                    <!-- End-of-board sign: sits over the board for three seconds,
                         before the dialog. Filled in by the engine. -->
                    <div id="w2-annuncio" class="w2-annuncio"></div>
                </div>
            </div>

            <!-- ================= BOTTOM BAR ================= -->
            <!-- The timetable: announced trains and trains already
                 running, with their state. It sits on its own, not inside
                 the bar: down here it is the only thing that needs height,
                 so it reaches the bottom edge. Filled in by aggiornaHud. -->
            <div id="w2-coda" title="Announced trains and trains on the move"></div>

            <div id="w2-messaggio">Loading the board&hellip;</div>

            <div id="barra-inferiore">
                <div id="w2-comandi">
                    <button class="bottone" id="w2-quadro" title="Choose the board to play">CHOOSE THE BOARD</button>
                    <button class="bottone" id="w2-pausa" aria-pressed="false" title="Freeze the game: the button blinks while paused">PAUSE</button>
                    <button class="bottone principale" id="w2-ricomincia" title="Start the chosen board over">RESTART</button>
                </div>
            </div>

            <!-- End-of-board dialog, filled in by the engine -->
            <div id="w2-modale"></div>

            <!-- Board chooser panel, filled in by the engine -->
            <div id="w2-scelte"></div>

            <!-- ================= FOOTER ================= -->
            <div class="legal-links-w2">
                <a href="privacy-en.html" target="_blank">Privacy Policy</a>
                <a href="javascript:googlefc.callbackQueue.push(googlefc.showRevocationMessage)">Manage Cookies</a>
            </div>

            <div class="link-giochi-w2">
                <a href="aboutme-en.html" target="_blank" class="pulsante-link-w2 pulsante-scrivetemi-w2">Write to me</a>
                <a href="regole-woowoo-en.html" target="_blank" class="pulsante-link-w2">RULES</a>
                <a href="index-en.html" class="pulsante-link-w2 pulsante-home-w2">ALL GAMES</a>
            </div>

        </div><!-- /campogioco -->
    </div><!-- /main-container -->

    <!-- Un file di dati solo: i quadri del gioco, A..L. Fino al 9/10/2026 qui
         si caricava anche l'estrazione del dischetto (dev/woowoo2-dati.js), e
         solo in modalita' sviluppo, perche' dev/ non si carica sul server:
         quello e' materiale Kingsoft, riferimento tecnico e non roba da
         pubblicare. Adesso il gioco non lo guarda piu' -- lo apre soltanto
         l'editor, dove le lettere del dischetto sono M..X -- e qui non c'e'
         piu' niente che dipenda da dev/. -->
    <!-- I codici delle piastrelle: cosa fa ogni numero. Vanno prima dei
         quadri, che il contenitore se lo fa questo file. -->
    <script src="woowoo-codici.js?v=1.3"></script>
    <script src="woowoo-mie.js?v=5.3"></script>
    <script src="woowoo-binari.js?v=2.2"></script>
    <script src="woowoo.js?v=1.80"></script>

</body>

</html>
