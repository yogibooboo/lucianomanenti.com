<body>

    <div class="main-container">
        <div id="sidebar-left" class="sidebar"></div>

        <div id="campogioco">

            <!-- ================= HEADER ================= -->
            <div id="header-bar">
                <div class="header-left">

                    <div id="titolo-gioco">WooWoo Luciano &#128642;</div>
                </div>

                <div class="header-center">
                    <div class="quadrante ok"><span>DELIVERIES</span><b id="w2-consegne">0</b></div>
                    <div class="quadrante ko"><span>CRASHES</span><b id="w2-scontri">0</b></div>
                    <div class="quadrante tempo">
                        <span>TIME <i id="w2-turbo"></i></span>
                        <b id="w2-tempo">0</b>
                        <div class="barra-esterna"><div class="barra-piena" id="w2-barra"></div></div>
                    </div>
                </div>

                <div class="header-right">
                    <div class="badge"><span>BOARD:</span> <b id="w2-livello">A &middot; 1/9</b></div>
                </div>
            </div>

            <!-- ================= MAIN AREA ================= -->
            <div id="area-tabellone">
                <div id="canvas-wrapper">
                    <canvas id="w2-canvas" width="960" height="576"></canvas>
                </div>
            </div>

            <!-- ================= BOTTOM BAR ================= -->
            <!-- The timetable: announced trains and trains already
                 running, with their state. It sits on its own, not inside
                 the bar: down here it is the only thing that needs height,
                 so it reaches the bottom edge. Filled in by aggiornaHud. -->
            <div id="w2-coda" title="Announced trains and trains on the move"></div>

            <div id="w2-messaggio">Loading the board&hellip;</div>

            <div id="barra-inferiore">
                <div id="w2-comandi">
                    <select id="w2-scelta" title="Choose a board from the disk"></select>
                    <select id="w2-scelta2" title="Choose one of your boards"></select>
                    <button class="bottone" id="w2-pausa" aria-pressed="false" title="Freeze the game: the button blinks while paused">PAUSE</button>
                    <button class="bottone principale" id="w2-ricomincia" title="Start the chosen board over">RESTART</button>
                </div>
            </div>

            <!-- End-of-board dialog, filled in by the engine -->
            <div id="w2-modale"></div>
