<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anteprima e Gestione Banner AliExpress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ali-red: #ff4747;
            --ali-red-dark: #cc0c39;
            --ali-dark: #131921;
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --input-bg: #141414;
            --border-color: #2e2e2e;
        }

        body {
            margin: 0;
            padding: 20px;
            background: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
        }

        /* --- VISTA GALLERIA --- */
        #galleryView {
            display: block;
        }

        h1 {
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            font-size: 2.2rem;
            margin-bottom: 25px;
            color: white;
        }

        /* Top Admin Panel Box */
        .admin-panel-box {
            max-width: 760px;
            margin: 0 auto 25px auto;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .panel-section-title {
            color: #ff9900;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .panel-form {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .panel-form input {
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: var(--input-bg);
            color: white;
            font-size: 13px;
            outline: none;
        }

        .panel-form input[type="text"] {
            width: 220px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }

        .btn-add { background: #2e7d32; color: white; }
        .btn-sync { background: #0288d1; color: white; }
        .btn-copy { background: #e67e22; color: white; }
        .btn-log { background: #374151; color: #d1d5db; font-size: 12px; }

        .divider {
            height: 1px;
            background: var(--border-color);
            margin: 18px 0;
        }

        /* View Mode Tabs */
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .tab-btn {
            padding: 10px 22px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #222533;
            color: #94a3b8;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: #e67e22;
            color: white;
            border-color: #e67e22;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 300px);
            gap: 25px;
            justify-content: center;
        }

        .banner-wrapper {
            text-decoration: none;
            color: inherit;
            display: block;
            width: 300px;
            height: 600px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .banner-wrapper:hover {
            transform: scale(1.02);
        }

        .banner-300x600 {
            position: relative;
            width: 300px;
            height: 600px;
            background: var(--ali-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .star-badge {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 7px;
            border-bottom-right-radius: 6px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .deal-header {
            background: var(--ali-red-dark);
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .image-container {
            width: 100%;
            height: 200px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .image-container.large-view {
            height: 460px;
        }

        .product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.3s ease;
        }

        .content {
            padding: 15px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            text-align: center;
            color: white;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-height: 80px;
        }

        .price-badge-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .price-text {
            font-size: 22px;
            font-weight: bold;
            color: #ff4747;
        }

        .status-badge {
            display: inline-block;
            background: var(--ali-red-dark);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .expiry-info {
            font-size: 11px;
            color: #94a3b8;
            font-style: italic;
        }

        .button-container {
            padding: 0 20px 12px 20px;
        }

        .cta-btn {
            display: block;
            background: linear-gradient(180deg, #ff9900 0%, #e68a00 100%);
            color: #000;
            padding: 14px;
            border-radius: 30px;
            font-weight: bold;
            text-align: center;
            font-size: 13px;
        }

        .disclosure {
            font-size: 10px;
            color: #64748b;
            text-align: center;
            padding: 8px;
            line-height: 1.2;
        }

        /* --- SCHERMATA DI PERSONALIZZAZIONE (EDITOR) --- */
        #editorView {
            display: none;
            max-width: 1300px;
            margin: 0 auto;
            gap: 30px;
        }

        .editor-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .editor-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .editor-label {
            font-size: 13px;
            font-weight: bold;
            color: #d1d5db;
            margin-bottom: 8px;
            display: block;
        }

        .editor-textarea {
            width: 100%;
            height: 65px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            padding: 10px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            resize: vertical;
        }

        .editor-row {
            display: flex;
            gap: 20px;
        }

        .editor-col-flex {
            flex: 1;
        }

        .editor-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .editor-select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
        }

        /* Grid Immagini Variante dell'Editor */
        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 160px);
            gap: 15px;
            margin-top: 10px;
        }

        .image-card-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-card-preview {
            width: 100%;
            height: 160px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            box-sizing: border-box;
        }

        .image-card-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .image-card-footer {
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            background: var(--panel-bg);
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .image-card-footer.active {
            color: #4ade80;
        }

        .image-card-footer.inactive {
            color: #94a3b8;
        }

        /* Sidebar Destra dell'Editor */
        .editor-sidebar {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .sidebar-tabs {
            display: flex;
            gap: 5px;
            width: 100%;
            justify-content: flex-end;
        }

        .sidebar-tab-btn {
            padding: 6px 12px;
            background: #2b2b36;
            border: 1px solid var(--border-color);
            color: #d1d5db;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .sidebar-tab-btn.active {
            background: #e67e22;
            color: white;
            border-color: #e67e22;
        }

        .sidebar-actions {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-sidebar {
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
            text-transform: uppercase;
        }

        .btn-visit { background: #e67e22; color: white; }
        .btn-delete { background: #dc2626; color: white; }
        .btn-save { background: #16a34a; color: white; }
        .btn-cancel { background: #4b5563; color: white; }
    </style>
</head>

<body>

    <!-- === SCHERMATA MAIN GALLERIA === -->
    <div id="galleryView">
        <h1>Anteprima e Gestione Banner</h1>

        <!-- Pannello superiore di gestione -->
        <div class="admin-panel-box">
            <div class="panel-section-title">➕ Aggiungi un Banner Manualmente</div>
            <div class="panel-form">
                <input type="text" id="addPid" placeholder="Incolla il Product ID (es. 1005007805694170)">
                <input type="text" id="addMsg" placeholder="Testo Rosso (es. In Offerta!)">
                <button class="btn btn-add" onclick="aggiungiProdottoManuale()">Aggiungi ad AliExpress</button>
            </div>

            <div class="divider"></div>

            <div class="panel-section-title">🔄 Sincronizzazione Globale</div>
            <div class="panel-form" style="margin-bottom: 0;">
                <button class="btn btn-sync" onclick="aggiornaTuttiIPrezzi()">Aggiorna Tutti i Prezzi Ora</button>
                <button class="btn btn-copy" onclick="copiaSuOneDrive()">📂 Copia su lucianomanenti.com</button>
                <a href="sync_log_ali.txt" target="_blank" class="btn btn-log">📄 Vedi Log Sistema</a>
            </div>
            <div id="statusMessage" style="margin-top: 12px; font-size: 13px; font-weight: bold; min-height: 20px; color: #4ade80;"></div>
        </div>

        <!-- Selettore Modalità Visualizzazione Galleria -->
        <div class="tabs-container">
            <button class="tab-btn active" id="tab1" onclick="switchView('standard')">1 (Visuale Standard)</button>
            <button class="tab-btn" id="tab2" onclick="switchView('image')">2 (Visuale Immagine)</button>
            <button class="tab-btn" id="tab3" onclick="switchView('anim')">Auto (Animazione)</button>
        </div>

        <!-- Griglia dei Banner 300x600 -->
        <div id="gallery" class="gallery-grid"></div>
    </div>

    <!-- === SCHERMATA DEDICATA DI PERSONALIZZAZIONE (EDITOR) === -->
    <div id="editorView">
        <!-- Area Principale Sinistra -->
        <div class="editor-main">
            <div class="editor-box">
                <label class="editor-label">Titolo Prodotto</label>
                <textarea id="editTitle" class="editor-textarea" oninput="updateLivePreview()"></textarea>

                <div class="editor-row" style="margin-top: 15px;">
                    <div class="editor-col-flex">
                        <label class="editor-label">Testo in Evidenza (Fascia Rossa)</label>
                        <input type="text" id="editHeader" class="editor-input" oninput="updateLivePreview()">
                    </div>
                    <div class="editor-col-flex">
                        <label class="editor-label">Peso (1-10)</label>
                        <select id="editWeight" class="editor-select" onchange="updateLivePreview()">
                            <option value="1">1 (Molto Raro)</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5" selected>5 (Standard)</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10 (Molto Frequente)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Griglia Selezione Immagini Variante -->
            <div class="images-grid" id="imagesGrid"></div>
        </div>

        <!-- Sidebar Destra dell'Editor -->
        <div class="editor-sidebar">
            <div class="sidebar-tabs">
                <button class="sidebar-tab-btn active" id="sideTab1" onclick="switchPreviewMode('vista1')">Vista 1</button>
                <button class="sidebar-tab-btn" id="sideTab2" onclick="switchPreviewMode('vista2')">Vista 2</button>
                <button class="sidebar-tab-btn" id="sideTab3" onclick="switchPreviewMode('auto')">Auto</button>
            </div>

            <!-- Anteprima Live Banner 300x600 -->
            <div class="banner-300x600" id="liveBanner">
                <div class="star-badge" id="previewStarBadge">⭐ 5</div>
                <div class="deal-header" id="previewHeader">OFFERTA ALIEXPRESS</div>
                <div class="image-container" id="previewImgContainer">
                    <img class="product-img" id="previewImg" src="" alt="Product">
                </div>
                <div class="content" id="previewContent">
                    <div class="title" id="previewTitle">Titolo Prodotto</div>
                    <div class="price-badge-row">
                        <span class="price-text" id="previewPrice">0,00 €</span>
                        <span class="status-badge" id="previewBadge">Sconto</span>
                    </div>
                    <div class="expiry-info" id="previewExpiry">In corso</div>
                </div>
                <div class="button-container" id="previewBtnContainer">
                    <div class="cta-btn">Vedi offerta su AliExpress</div>
                </div>
                <div class="disclosure" id="previewDisclosure">
                    Disponibile su AliExpress<br>
                    <span style="font-size: 9px; opacity: 0.7;">In qualità di affiliato AliExpress, guadagno dagli acquisti idonei.</span>
                </div>
            </div>

            <!-- Pulsanti Azione In Basso a Destra -->
            <div class="sidebar-actions">
                <button class="btn-sidebar btn-visit" onclick="visitaLinkAli()">🔍 VAI SU ALIEXPRESS</button>
                <button class="btn-sidebar btn-delete" onclick="eliminaBanner()">🗑️ ELIMINA BANNER</button>
                <button class="btn-sidebar btn-save" onclick="salvaEDisci()">💾 ESCI E SALVA MODIFICHE</button>
                <button class="btn-sidebar btn-cancel" onclick="chiudiEditorSenzaSalvare()">✕ ESCI SENZA MODIFICHE</button>
            </div>
        </div>
    </div>

    <script>
        let allDeals = [];
        let currentView = 'standard';
        let editingIndex = null;
        let previewMode = 'vista1';

        // Timer per la rotazione automatica delle immagini
        let rotationTimers = [];
        let editorRotationTimer = null;

        function stopAllRotationTimers() {
            rotationTimers.forEach(t => clearInterval(t));
            rotationTimers = [];
            if (editorRotationTimer) {
                clearInterval(editorRotationTimer);
                editorRotationTimer = null;
            }
        }

        async function loadDeals() {
            try {
                let response = await fetch('newdeals_aliexpress.json?nocache=' + Date.now());
                if (!response.ok) {
                    response = await fetch('banner/newdeals_aliexpress.json?nocache=' + Date.now());
                }
                const data = await response.json();
                allDeals = data.deals || [];
                renderGallery();
            } catch (err) {
                console.error(err);
                document.getElementById('gallery').innerHTML = '<p style="color:#ff4747;text-align:center;">Errore caricamento banner/newdeals_aliexpress.json</p>';
            }
        }

        function switchView(mode) {
            currentView = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (mode === 'standard') document.getElementById('tab1').classList.add('active');
            if (mode === 'image') document.getElementById('tab2').classList.add('active');
            if (mode === 'anim') document.getElementById('tab3').classList.add('active');
            renderGallery();
        }

        function renderGallery() {
            stopAllRotationTimers();
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            if (!allDeals || allDeals.length === 0) {
                gallery.innerHTML = '<p style="color:#94a3b8;">Nessun banner presente.</p>';
                return;
            }

            allDeals.forEach((deal, idx) => {
                const card = document.createElement('div');
                card.className = 'banner-wrapper';
                card.onclick = () => apriEditorBanner(idx);

                const headerText = deal.custom_message || 'OFFERTA ALIEXPRESS';
                const weight = deal.weight !== undefined ? deal.weight : 5;
                const activeImgs = deal.active_images && deal.active_images.length > 0 ? deal.active_images : [deal.img];
                const mainImg = activeImgs[0] || deal.img;
                const priceText = deal.price || '';
                const badgeText = deal.badge || '';

                let innerContent = '';

                if (currentView === 'standard') {
                    innerContent = `
                        <div class="banner-300x600" style="opacity: ${deal.active !== false ? 1 : 0.45};">
                            <div class="star-badge">⭐ ${weight}</div>
                            <div class="deal-header">${headerText}</div>
                            <div class="image-container">
                                <img class="product-img" id="gallery_img_${idx}" src="${mainImg}" alt="Product">
                            </div>
                            <div class="content">
                                <div class="title" title="${deal.title}">${deal.title || 'Senza Titolo'}</div>
                                <div class="price-info">
                                    <div class="price-badge-row">
                                        ${priceText ? `<span class="price-text">${priceText}</span>` : ''}
                                        ${badgeText ? `<span class="status-badge">${badgeText}</span>` : ''}
                                    </div>
                                    <div class="expiry-info">${deal.expiry || ''}</div>
                                </div>
                            </div>
                            <div class="button-container">
                                <div class="cta-btn">Vedi offerta su AliExpress</div>
                            </div>
                            <div class="disclosure">
                                Disponibile su AliExpress<br>
                                <span style="font-size: 9px; opacity: 0.7;">In qualità di affiliato AliExpress, guadagno dagli acquisti idonei.</span>
                            </div>
                        </div>
                    `;
                } else if (currentView === 'image') {
                    innerContent = `
                        <div class="banner-300x600" style="opacity: ${deal.active !== false ? 1 : 0.45};">
                            <div class="star-badge">⭐ ${weight}</div>
                            <div class="deal-header">${headerText}</div>
                            <div class="image-container large-view">
                                <img class="product-img" id="gallery_img_${idx}" src="${mainImg}" alt="Product">
                            </div>
                            <div class="button-container" style="padding-top:15px;">
                                <div class="cta-btn">Vedi offerta su AliExpress</div>
                            </div>
                        </div>
                    `;
                } else { // Auto / Animazione
                    innerContent = `
                        <div class="banner-300x600" style="opacity: ${deal.active !== false ? 1 : 0.45};">
                            <div class="star-badge">⭐ ${weight} (Rotatore)</div>
                            <div class="deal-header">${headerText}</div>
                            <div class="image-container large-view">
                                <img class="product-img" id="gallery_img_${idx}" src="${mainImg}" alt="Product">
                            </div>
                            <div class="button-container" style="padding-top:15px;">
                                <div class="cta-btn">Vedi offerta su AliExpress</div>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = innerContent;
                gallery.appendChild(card);

                // Attiva il timer di rotazione solo se siamo in modalità "Auto (Animazione)" e ci sono più immagini
                if (currentView === 'anim' && activeImgs.length > 1) {
                    let imgIdx = 0;
                    const timer = setInterval(() => {
                        imgIdx = (imgIdx + 1) % activeImgs.length;
                        const imgEl = document.getElementById(`gallery_img_${idx}`);
                        if (imgEl) {
                            imgEl.style.opacity = '0';
                            setTimeout(() => {
                                imgEl.src = activeImgs[imgIdx];
                                imgEl.style.opacity = '1';
                            }, 150);
                        }
                    }, 2500);
                    rotationTimers.push(timer);
                }
            });
        }

        /* --- LOGICA EDITOR DI PERSONALIZZAZIONE --- */
        function apriEditorBanner(idx) {
            stopAllRotationTimers();
            editingIndex = idx;
            const deal = allDeals[idx];

            document.getElementById('editTitle').value = deal.title || '';
            document.getElementById('editHeader').value = deal.custom_message || '';
            document.getElementById('editWeight').value = (deal.weight !== undefined) ? deal.weight : 5;

            // Popola la griglia delle immagini variante
            const grid = document.getElementById('imagesGrid');
            grid.innerHTML = '';
            const allImgs = deal.all_images && deal.all_images.length > 0 ? deal.all_images : [deal.img];
            const activeImgs = deal.active_images || [deal.img];

            allImgs.forEach(url => {
                const isAct = activeImgs.includes(url);
                const card = document.createElement('div');
                card.className = 'image-card-box';
                card.innerHTML = `
                    <div class="image-card-preview">
                        <img src="${url}">
                    </div>
                    <div class="image-card-footer ${isAct ? 'active' : 'inactive'}" onclick="toggleImageActive('${url}')">
                        <input type="checkbox" ${isAct ? 'checked' : ''}> Immagine Attiva
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('galleryView').style.display = 'none';
            document.getElementById('editorView').style.display = 'flex';

            switchPreviewMode('vista1');
        }

        function toggleImageActive(url) {
            const deal = allDeals[editingIndex];
            let activeImgs = deal.active_images || [deal.img];
            if (activeImgs.includes(url)) {
                if (activeImgs.length > 1) {
                    activeImgs = activeImgs.filter(u => u !== url);
                }
            } else {
                activeImgs.push(url);
            }
            deal.active_images = activeImgs;
            apriEditorBanner(editingIndex);
        }

        function updateLivePreview() {
            if (editingIndex === null) return;
            const deal = allDeals[editingIndex];

            const titleVal = document.getElementById('editTitle').value;
            const headerVal = document.getElementById('editHeader').value;
            const weightVal = document.getElementById('editWeight').value;

            document.getElementById('previewStarBadge').textContent = '⭐ ' + weightVal;
            document.getElementById('previewHeader').textContent = headerVal || 'OFFERTA ALIEXPRESS';
            document.getElementById('previewTitle').textContent = titleVal || 'Senza Titolo';
            document.getElementById('previewPrice').textContent = deal.price || '';
            document.getElementById('previewBadge').textContent = deal.badge || '';
            document.getElementById('previewExpiry').textContent = deal.expiry || '';

            const activeImgs = deal.active_images && deal.active_images.length > 0 ? deal.active_images : [deal.img];

            const imgContainer = document.getElementById('previewImgContainer');
            const contentBox = document.getElementById('previewContent');
            const disclosureBox = document.getElementById('previewDisclosure');

            if (previewMode === 'vista1') {
                imgContainer.className = 'image-container';
                contentBox.style.display = 'flex';
                disclosureBox.style.display = 'block';
                document.getElementById('previewImg').src = activeImgs[0] || deal.img;
            } else if (previewMode === 'vista2') {
                imgContainer.className = 'image-container large-view';
                contentBox.style.display = 'none';
                disclosureBox.style.display = 'none';
                document.getElementById('previewImg').src = activeImgs[0] || deal.img;
            } else if (previewMode === 'auto') {
                imgContainer.className = 'image-container large-view';
                contentBox.style.display = 'none';
                disclosureBox.style.display = 'none';
                
                // Avvia la rotazione automatica per la modalità Auto
                if (editorRotationTimer) clearInterval(editorRotationTimer);
                let rotIdx = 0;
                document.getElementById('previewImg').src = activeImgs[0] || deal.img;
                if (activeImgs.length > 1) {
                    editorRotationTimer = setInterval(() => {
                        rotIdx = (rotIdx + 1) % activeImgs.length;
                        const imgEl = document.getElementById('previewImg');
                        imgEl.style.opacity = '0';
                        setTimeout(() => {
                            imgEl.src = activeImgs[rotIdx];
                            imgEl.style.opacity = '1';
                        }, 150);
                    }, 2500);
                }
            }
        }

        function switchPreviewMode(mode) {
            previewMode = mode;
            if (editorRotationTimer) {
                clearInterval(editorRotationTimer);
                editorRotationTimer = null;
            }

            document.querySelectorAll('.sidebar-tab-btn').forEach(btn => btn.classList.remove('active'));
            if (mode === 'vista1') document.getElementById('sideTab1').classList.add('active');
            if (mode === 'vista2') document.getElementById('sideTab2').classList.add('active');
            if (mode === 'auto') document.getElementById('sideTab3').classList.add('active');

            updateLivePreview();
        }

        function visitaLinkAli() {
            if (editingIndex === null) return;
            window.open(allDeals[editingIndex].link, '_blank');
        }

        function eliminaBanner() {
            if (editingIndex === null) return;
            if (confirm('Sei sicuro di voler disattivare questo banner?')) {
                allDeals[editingIndex].active = false;
                salvaEDisci();
            }
        }

        async function salvaEDisci() {
            if (editingIndex === null) return;
            const deal = allDeals[editingIndex];

            deal.title = document.getElementById('editTitle').value.trim();
            deal.custom_message = document.getElementById('editHeader').value.trim();
            deal.weight = parseInt(document.getElementById('editWeight').value, 10) || 5;

            await salvaTuttiIDeals();
            chiudiEditorSenzaSalvare();
        }

        function chiudiEditorSenzaSalvare() {
            stopAllRotationTimers();
            editingIndex = null;
            document.getElementById('editorView').style.display = 'none';
            document.getElementById('galleryView').style.display = 'block';
            renderGallery();
        }

        async function salvaTuttiIDeals() {
            try {
                let endpoint = 'api_salva_deals_ali.php';
                let resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deals: allDeals })
                });
                if (!resp.ok) {
                    endpoint = 'banner/api_salva_deals_ali.php';
                    resp = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ deals: allDeals })
                    });
                }
                const res = await resp.json();
                console.log(res.message);
            } catch (e) {
                console.error('Errore salvataggio.');
            }
        }

        function showStatusMessage(msg, isError = false) {
            const el = document.getElementById('statusMessage');
            if (!el) return;
            el.textContent = msg;
            el.style.color = isError ? '#ff4747' : '#4ade80';
            if (msg && !msg.startsWith('🔄') && !msg.startsWith('⏳')) {
                setTimeout(() => {
                    if (el.textContent === msg) el.textContent = '';
                }, 5000);
            }
        }

        async function aggiungiProdottoManuale() {
            const pid = document.getElementById('addPid').value.trim();
            const msg = document.getElementById('addMsg').value.trim();
            if (!pid) { showStatusMessage('⚠️ Inserisci un Product ID AliExpress valido!', true); return; }

            showStatusMessage('⏳ Aggiunta Product ID in corso...');
            try {
                let resp = await fetch('api_ricevi_ali_id.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_id: pid, message: msg })
                });
                if (!resp.ok) {
                    resp = await fetch('banner/api_ricevi_ali_id.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ product_id: pid, message: msg })
                    });
                }
                showStatusMessage('✅ Product ID aggiunto con successo! Avvio sincronizzazione...');
                document.getElementById('addPid').value = '';
                document.getElementById('addMsg').value = '';
                aggiornaTuttiIPrezzi();
            } catch (e) {
                showStatusMessage('⚠️ Errore durante l\'aggiunta del prodotto.', true);
            }
        }

        async function aggiornaTuttiIPrezzi() {
            showStatusMessage('🔄 Sincronizzazione prezzi da API AliExpress in corso...');
            try {
                let resp = await fetch('aggiorna_offerte_aliexpress.php');
                if (!resp.ok) {
                    resp = await fetch('banner/aggiorna_offerte_aliexpress.php');
                }
                showStatusMessage('✅ Sincronizzazione completata con successo!');
                loadDeals();
            } catch (e) {
                showStatusMessage('⚠️ Errore durante la sincronizzazione.', true);
            }
        }

        async function copiaSuOneDrive() {
            showStatusMessage('⏳ Copia del file su lucianomanenti.com in corso...');
            try {
                let resp = await fetch('api_copia_su_sito_ali.php');
                if (!resp.ok) {
                    resp = await fetch('banner/api_copia_su_sito_ali.php');
                }
                const res = await resp.json();
                if (res.status === 'success') {
                    showStatusMessage('✅ ' + res.message);
                } else {
                    showStatusMessage('⚠️ ' + res.message, true);
                }
            } catch (e) {
                showStatusMessage('⚠️ Errore durante la pubblicazione su OneDrive.', true);
            }
        }

        loadDeals();
        setInterval(() => { if (editingIndex === null) loadDeals(); }, 3000);
        window.addEventListener('focus', () => { if (editingIndex === null) loadDeals(); });
    </script>
</body>

</html>
